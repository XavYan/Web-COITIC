name: Publicar web del COITIC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar Markdown y preparar archivos estáticos
        run: python3 scripts/prepare.py --output _site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
